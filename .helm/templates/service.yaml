apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}-service
spec:
  type: ClusterIP
  selector:
    app: {{ .Chart.Name }}-pod
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.app.servicePort | default 8080 }}
      targetPort: {{ .Values.app.targetPort | default 8080 }}
